name: iOS Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect Xcode and simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install CocoaPods if absent
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          if ! command -v pod >/dev/null; then
            gem install cocoapods --no-document
          fi
      - name: Run SDK and production SQLite migration tests without signing
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: bash Scripts/ci/verify_publish_outcomes_macos.sh
      - name: Package tested unsigned simulator app
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, subprocess
          candidates = list(pathlib.Path("build").glob("ios-01-a-*/DerivedData/Build/Products/Debug-iphonesimulator/Tinodios.app"))
          if len(candidates) != 1:
              raise SystemExit("Expected exactly one tested simulator app")
          app = candidates[0]
          target = app.parents[4] / "CLAW-OS-unsigned-simulator.zip"
          subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(app), str(target)], check=True)
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          manifest = {"commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"],
                      "artifact": target.name, "sha256": hashlib.sha256(target.read_bytes()).hexdigest(),
                      "bundle_id": info["CFBundleIdentifier"], "version": info["CFBundleShortVersionString"],
                      "build": info["CFBundleVersion"], "platform": "iOS Simulator", "signed": False,
                      "phone_installable": False, "push_config": "disabled placeholder", "backend": "127.0.0.1:9",
                      "scope": "SDK and SQLite tests passed; App UI, devices, network and push not accepted"}
          (target.parent / "simulator-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY
      - name: Cold launch tested app on the same simulator
        run: python3 Scripts/ci/smoke_simulator_launch.py --build-root build
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-local-store-${{ github.sha }}
          path: |
            build/licenses/*.json
            build/licenses/*.plist
            build/ios-01-a-*/static.json
            build/ios-01-a-*/*-summary.json
            build/ios-01-a-*/*-summary.err
            build/ios-01-a-*/sdk.log
            build/ios-01-a-*/storage.log
            build/ios-01-a-*/sdk.xcresult
            build/ios-01-a-*/storage.xcresult
            build/ios-01-a-*/CLAW-OS-unsigned-simulator.zip
            build/ios-01-a-*/simulator-manifest.json
            build/ios-01-a-*/simulator-id.txt
            build/ios-01-a-*/launch-smoke/**
          if-no-files-found: warn
          retention-days: 7
